<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARTISTA MUSIC | Official Booking Roster 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #181408 0%, #08080a 50%, #030304 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .ecard-container {
      width: 100%;
      max-width: 480px;
      background: #090a0d;
      border: 2px solid #d4af37;
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.28), 0 25px 60px rgba(0,0,0,0.9);
      overflow: hidden;
      position: relative;
    }

    /* Flyer Showcase */
    .flyer-wrapper {
      width: 100%;
      line-height: 0;
      background: #000;
      border-bottom: 2px solid #d4af37;
    }
    .flyer-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Powered By Badge */
    .powered-bar {
      margin: 14px 16px 6px;
      background: linear-gradient(90deg, rgba(212,175,55,0.06), rgba(212,175,55,0.22), rgba(212,175,55,0.06));
      border: 1px solid rgba(212, 175, 55, 0.6);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .powered-label {
      font-size: 8.5px;
      letter-spacing: 3px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.9;
    }
    .powered-name {
      font-family: 'Cinzel', serif;
      font-size: 13.5px;
      letter-spacing: 3.5px;
      color: #fff;
      font-weight: 900;
      margin-top: 3px;
      text-shadow: 0 0 10px rgba(212,175,55,0.6);
    }

    /* Booking Dock */
    .booking-dock {
      background: linear-gradient(180deg, #13141b 0%, #07080a 100%);
      padding: 16px 16px 22px;
      text-align: center;
    }
    .booking-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
    }
    .rep-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 24px;
      color: #fff;
      margin: 4px 0 14px;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 18px;
      margin-bottom: 9px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-phone {
      background: linear-gradient(135deg, #fce07f 0%, #d4af37 50%, #997415 100%);
      color: #0b0b0e;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
      font-size: 15px;
    }
    .btn-phone:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }
    .btn-email {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.6);
      color: #d4af37;
    }
    .btn-email:hover {
      background: rgba(212, 175, 55, 0.15);
      color: #fff;
    }
    .btn-share {
      background: transparent;
      border: none;
      color: #8c8f9b;
      font-size: 11px;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: underline;
      cursor: pointer;
    }
    .footer-note {
      font-size: 9px;
      color: #8a8d9b;
      letter-spacing: 1.5px;
      margin-top: 14px;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .footer-highlight {
      color: #d4af37;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="ecard-container">
    <!-- Displays the exact PNG filename you uploaded -->
    <div class="flyer-wrapper">
      <img src="07AB0C5F-46E6-479E-8B18-317E112D7591.png" alt="Artista Music Official Artist Roster 2026">
    </div>

    <!-- Official Partnership Badge -->
    <div class="powered-bar">
      <div class="powered-label">⚡ POWERED BY</div>
      <div class="powered-name">REGIOMEX MUSIC GROUP</div>
    </div>

    <!-- Booking Desk -->
    <div class="booking-dock">
      <div class="booking-label">Official Booking Representation</div>
      <div class="rep-name">Fernando Sanchez</div>

      <a href="tel:2103850515" class="btn-action btn-phone">
        📞 Call (210) 385-0515
      </a>

      <a href="mailto:Fersan17@gmail.com?subject=Booking%20Inquiry%20-%20Artista%20Music%20Roster%202026" class="btn-action btn-email">
        ✉️ Email Fersan17@gmail.com
      </a>

      <button onclick="shareCard()" class="btn-share">📤 Share This eCard</button>

      <div class="footer-note">
        All Rights Reserved • Artista Music LLC<br>
        <span class="footer-highlight">POWERED BY REGIOMEX MUSIC GROUP</span>
      </div>
    </div>
  </div>

  <script>
    function shareCard() {
      if (navigator.share) {
        navigator.share({
          title: 'ARTISTA MUSIC - Official Booking Roster 2026',
          text: 'Official booking contact and roster for Artista Music. Powered by Regiomex Music Group.',
          url: window.location.href,
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    }
  </script>
</body>
</html>
