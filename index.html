
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARTISTA MUSIC | Official Booking Roster 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #181408 0%, #08080a 50%, #030304 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .ecard-container {
      width: 100%;
      max-width: 480px;
      background: #090a0d;
      border: 2px solid #d4af37;
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.28), 0 25px 60px rgba(0,0,0,0.9);
      overflow: hidden;
      position: relative;
    }

    /* Tap prompt header */
    .tap-hint {
      text-align: center;
      padding: 10px 10px 8px;
      font-size: 10.5px;
      letter-spacing: 2.5px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(180deg, rgba(212,175,55,0.18) 0%, rgba(9,10,13,0.9) 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }

    /* Flyer Image & Interactive Hotspots */
    .flyer-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-bottom: 2px solid #d4af37;
    }
    .flyer-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 8 Hotspot Buttons aligned to the 2x4 grid on the flyer */
    .artist-overlay {
      position: absolute;
      top: 28%;    /* starts over first row of artist boxes */
      left: 2%;
      width: 96%;
      height: 58%; /* covers all 8 artist boxes down to signature */
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      z-index: 10;
    }
    .hotspot-btn {
      background: transparent;
      border: 1px dashed rgba(212, 175, 55, 0.0);
      border-radius: 8px;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .hotspot-btn:active, .hotspot-btn:hover {
      background: rgba(212, 175, 55, 0.28);
      border-color: #d4af37;
    }

    /* Powered By Banner */
    .powered-bar {
      margin: 14px 16px 6px;
      background: linear-gradient(90deg, rgba(212,175,55,0.06), rgba(212,175,55,0.22), rgba(212,175,55,0.06));
      border: 1px solid rgba(212, 175, 55, 0.6);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .powered-label {
      font-size: 8.5px;
      letter-spacing: 3px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.9;
    }
    .powered-name {
      font-family: 'Cinzel', serif;
      font-size: 13.5px;
      letter-spacing: 3.5px;
      color: #fff;
      font-weight: 900;
      margin-top: 3px;
      text-shadow: 0 0 10px rgba(212,175,55,0.6);
    }

    /* Booking Dock */
    .booking-dock {
      background: linear-gradient(180deg, #13141b 0%, #07080a 100%);
      padding: 16px 16px 22px;
      text-align: center;
    }
    .booking-label {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
    }
    .rep-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 24px;
      color: #fff;
      margin: 4px 0 14px;
    }
    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 18px;
      margin-bottom: 9px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-phone {
      background: linear-gradient(135deg, #fce07f 0%, #d4af37 50%, #997415 100%);
      color: #0b0b0e;
      box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
      font-size: 15px;
    }
    .btn-phone:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }
    .btn-email {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.6);
      color: #d4af37;
    }
    .btn-email:hover {
      background: rgba(212, 175, 55, 0.15);
      color: #fff;
    }
    .btn-share {
      background: transparent;
      border: none;
      color: #8c8f9b;
      font-size: 11px;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: underline;
      cursor: pointer;
    }
    .footer-note {
      font-size: 9px;
      color: #8a8d9b;
      letter-spacing: 1.5px;
      margin-top: 14px;
      text-transform: uppercase;
      line-height: 1.5;
    }
    .footer-highlight {
      color: #d4af37;
      font-weight: 700;
    }

    /* Modal Sheet Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-card {
      background: #0f1016;
      border: 2px solid #d4af37;
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      padding: 22px 18px 20px;
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
      text-align: center;
      position: relative;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: #8c8f9b;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }
    .modal-genre {
      font-size: 10px;
      letter-spacing: 3px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 700;
    }
    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: #fff;
      margin: 4px 0 16px;
      font-weight: 900;
    }
    .outlet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 9px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      transition: filter 0.2s, transform 0.2s;
    }
    .outlet-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn-yt {
      background: #ff0000;
      box-shadow: 0 3px 12px rgba(255, 0, 0, 0.35);
    }
    .btn-sp {
      background: #1db954;
      box-shadow: 0 3px 12px rgba(29, 185, 84, 0.35);
    }
    .btn-ig {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      box-shadow: 0 3px 12px rgba(220, 39, 67, 0.35);
    }
    .btn-fb {
      background: #1877f2;
      box-shadow: 0 3px 12px rgba(24, 119, 242, 0.35);
    }
    .outlet-icon {
      font-size: 16px;
    }
  </style>
</head>
<body>

    <div class="tap-hint">👆 Tap Any Artist To Open Outlets</div>

    <div class="flyer-wrapper">
